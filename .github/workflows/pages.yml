# SPDX-License-Identifier: AGPL-3.0-or-later
# Deploys the site to GitHub Pages (omaflake.app – the domain lives in the repository's Pages settings) on every push
# to main. No build step; only the public files go into the artifact. Actions are pinned by commit, with the version
# as a comment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Site files only
        run: |
          mkdir _site
          cp -R index.html style.css download.js update.json site.webmanifest favicon* apple-touch-icon.png icon-*.png \
            assets catalog recipes .well-known _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true # .well-known/ and .nojekyll
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
