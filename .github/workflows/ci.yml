# SPDX-License-Identifier: AGPL-3.0-or-later
# The licence check (REUSE) and a sign-off (DCO) on every commit of a pull request – both from falkoss/starterpack,
# pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
